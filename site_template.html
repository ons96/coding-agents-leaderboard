<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
/* App shell: the page itself never scrolls; one inner scroller holds the
   header, filters and table. Wide tables therefore never widen the document,
   which would make phone browsers zoom out and break sticky positioning. */
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;background:#f8f9fa;color:#212529;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{flex:none;background:#1a1a2e;color:#fff;padding:16px 24px}
.header h1{font-size:18px;font-weight:600;display:inline-block}
.header .meta{font-size:11px;color:#adb5bd;margin-top:4px}
.nav{float:right;font-size:12px;margin-top:2px}
.nav a{color:#8ecae6;text-decoration:none;margin-left:12px}
.nav a:hover{text-decoration:underline}
.controls{flex:none;background:#fff;border-bottom:1px solid #dee2e6;padding:8px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls input{padding:6px 10px;border:1px solid #ced4da;border-radius:4px;font-size:13px;width:280px}
.controls select{padding:6px 8px;border:1px solid #ced4da;border-radius:4px;font-size:13px}
.controls input[type=number]{width:96px}
.controls button{padding:6px 12px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.controls button.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.group-toggles{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.controls .rate{display:flex;align-items:center;gap:4px;font-size:12px;color:#495057;white-space:nowrap}
.controls .rate input{width:64px;padding:4px 6px}
/* The table pane is the only scroller: it fills what the header, controls and
   pager leave over, and the header row pins to its top. */
/* One scroller for everything above the pager: the page header and the filter
   bar scroll away first, then the table's header row pins to the top of the
   scroller. The page itself never scrolls, so a wide table cannot widen the
   document (which makes phone browsers zoom out and break sticky positioning). */
.scroller{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.table-wrap{position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;white-space:nowrap}
thead th{background:#e9ecef;padding:6px 10px;text-align:right;font-weight:600;font-size:12px;border-bottom:2px solid #adb5bd;border-right:1px solid #dee2e6;cursor:pointer;user-select:none;position:sticky;top:0;z-index:10}
thead th.asc::after{content:" \25B2";font-size:10px}
thead th.desc::after{content:" \25BC";font-size:10px}
thead th.text-col{text-align:left}
tbody td{padding:4px 10px;text-align:right;border-bottom:1px solid #e9ecef;border-right:1px solid #e9ecef;font-variant-numeric:tabular-nums}
tbody td.text-col{text-align:left}
tbody tr:nth-child(even) td{background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.03))}
tbody tr:hover td{background-color:#e7f5ff;background-image:none}
.gp-identity{background:#e8f4f8}.gp-core{background:#ffe8cc}.gp-cost_time{background:#fff9db}.gp-derived{background:#d3f9d8}
/* Frozen identity column: pinned to the left edge while the table scrolls sideways. */
th.sticky-col,td.sticky-col{position:sticky;left:0;z-index:6;max-width:18em;overflow:hidden;text-overflow:ellipsis;border-right:1px solid #adb5bd;box-shadow:2px 0 5px -2px rgba(0,0,0,.3)}
/* Model names carry a variant in brackets: "Claude Sonnet 5.5 (xhigh)". On a
   phone the variant drops to a second, smaller line so the column stays narrow. */
.sticky-col .mn{display:inline}
.sticky-col .mv{display:inline;font-weight:600}
.sticky-col .mv::before{content:"("}
.sticky-col .mv::after{content:")"}
thead th.sticky-col{z-index:20}
.paging{flex:none;padding:8px 16px;background:#fff;border-top:1px solid #dee2e6;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.paging button{padding:4px 10px;border:1px solid #ced4da;border-radius:4px;background:#fff;cursor:pointer}
.footer{flex:none;text-align:center;padding:8px;font-size:11px;color:#868e96;background:#f1f3f5}
.footer a{color:#1a1a2e}
.notice{background:#fffbe6;padding:10px 24px;line-height:1.5;border-bottom:1px solid #e6dca6}
.notice details{margin-top:6px}.notice li{margin:4px 0 4px 20px}.notice a{color:#174d7a}
/* Phones: trim the chrome so more rows fit once the filters scroll away. */
@media (max-width:700px){
.header{padding:10px 12px}
.header h1{font-size:15px}
.nav{float:none;margin-bottom:4px}
.nav a{margin:0 12px 0 0}
.controls{padding:6px 8px;gap:6px}
.controls input{width:100%}
.group-toggles{margin-left:0}
.notice{padding:8px 12px}
.footer{display:none}
/* A frozen name column that eats half the screen leaves no room for data:
   cap it, let it wrap, and tighten the cell padding so more columns fit. */
th.sticky-col,td.sticky-col{max-width:40vw;white-space:normal;line-height:1.2}
.sticky-col .mn,.sticky-col .mv{display:block}
.sticky-col .mv{font-size:10px;color:#495057}
.sticky-col .mv::before,.sticky-col .mv::after{content:none}
thead th,tbody td{padding-left:6px;padding-right:6px}
}
</style>
</head>
<body>
<div class="scroller">
<div class="header">
__NAV__
<h1>__TITLE__</h1>
<div class="meta" id="meta-info">Loading...</div>
</div>
__FREE_NOTICE__
<div class="controls">
<input type="text" id="search" placeholder="__FILTER_PLACEHOLDER__">
<select id="__FILTER_ID__"><option value="">All</option></select>
<button id="btn-reset">Reset</button>
__SORT_BUTTONS__
__PARETO_CONTROLS__
__FREE_CONTROLS__
<div class="group-toggles" id="group-toggles"></div>
__TIME_RATE__
</div>
<div class="table-wrap">
<table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>
</div>
<div class="paging" id="paging"></div>
<div class="footer">
Data from <a href="__FOOTER_URL__">artificialanalysis.ai</a> |
Updated: <span id="update-date">-</span>
</div>
<script src="__SCRIPT_SRC__"></script>
<script>
const PS=100;
let filtered=[...TABLE_DATA],sortCol=DEFAULT_SORT,sortDir=1,hiddenGroups=new Set(),page=0;
const TXT_COLS=new Set(__TXT_COLS__);
const FILTER_FIELD=__FILTER_FIELD__;
const SORT_ACTIONS=__SORT_ACTIONS__;
const BOOL_COLS=new Set(["pareto","pareto_cost","pareto_cheap","has_free_api"]);
const COMBO_COLS=new Set(["cost_per_min","cost_plus_time","score_per_all"]);
const STICKY_COL=__STICKY_COL__;
let freeOnly=false,frontierMode="all",minScore=null,timeRate=60;

function init(){
  const scrapeDay=META.scrape_date?META.scrape_date.slice(0,10):"";
  document.getElementById("meta-info").textContent=META.row_count+" "+__ENTITY_LABEL__+" | "+(scrapeDay||"artificialanalysis.ai");
  document.getElementById("update-date").textContent=scrapeDay||"—";
  const hf=document.getElementById("__FILTER_ID__");
  [...new Set(TABLE_DATA.map(r=>r[FILTER_FIELD]).filter(Boolean))].sort().forEach(h=>{
    const o=document.createElement("option");o.value=h;o.textContent=h;hf.appendChild(o);
  });
  buildGroupToggles();
  if(!COLUMNS.includes(sortCol))sortCol=null;
  if(sortCol)sortDir=HIGHLIGHTS[sortCol]==="lower"?1:-1;
  document.getElementById("search").addEventListener("input",debounce(filterAndRender,200));
  document.getElementById("__FILTER_ID__").addEventListener("change",filterAndRender);
  document.getElementById("btn-reset").addEventListener("click",()=>{
    document.getElementById("search").value="";
    freeOnly=false;frontierMode="all";minScore=null;
    const fSel=document.getElementById("frontier");
    if(fSel)fSel.value="all";
    const mEl=document.getElementById("min-score");
    if(mEl)mEl.value="";
    for(const id of ["free-toggle"]){
      const toggle=document.getElementById(id);
      if(toggle){toggle.classList.remove("active");toggle.setAttribute("aria-pressed","false");}
    }
    document.getElementById("__FILTER_ID__").value="";
    hiddenGroups.clear();
    document.querySelectorAll(".grp-btn").forEach(b=>b.classList.add("active"));
    sortCol=COLUMNS.includes(DEFAULT_SORT)?DEFAULT_SORT:null;
    sortDir=(sortCol&&HIGHLIGHTS[sortCol]==="lower")?1:-1;
    page=0;filterAndRender();
  });
  SORT_ACTIONS.forEach(([id,col])=>{
    document.getElementById(id).addEventListener("click",()=>sortBy(col,"higher"));
  });
  const frontierSel=document.getElementById("frontier");
  if(frontierSel){
    frontierSel.addEventListener("change",()=>{
      frontierMode=frontierSel.value;
      // A frontier view is an ascending shortlist on its own axis: time for the
      // fast views, cost for the cheap one.
      const f=FRONTIER&&(FRONTIER.filters||[]).find(x=>x.value===frontierMode);
      if(frontierMode.indexOf("pareto")===0&&FRONTIER){
        sortCol=f&&COLUMNS.includes(f.sort)?f.sort:FRONTIER.time;sortDir=1;
      }
      page=0;filterAndRender();
    });
  }
  const minScoreEl=document.getElementById("min-score");
  if(minScoreEl){
    minScoreEl.addEventListener("input",debounce(()=>{
      const v=parseFloat(minScoreEl.value);
      minScore=Number.isFinite(v)?v:null;page=0;filterAndRender();
    },200));
  }
  const freeBtn=document.getElementById("free-toggle");
  if(freeBtn){
    freeBtn.addEventListener("click",()=>{
      freeOnly=!freeOnly;
      freeBtn.classList.toggle("active",freeOnly);
      freeBtn.setAttribute("aria-pressed",String(freeOnly));
      page=0;filterAndRender();
    });
  }
  const rateEl=document.getElementById("time-rate");
  if(rateEl){
    try{
      const saved=localStorage.getItem("timeRate");
      if(saved!==null&&saved!=="")rateEl.value=saved;
    }catch(e){}
    const parseRate=()=>{
      const v=parseFloat(rateEl.value);
      timeRate=Number.isFinite(v)&&v>=0?v:0;
    };
    parseRate();
    rateEl.addEventListener("input",debounce(()=>{
      parseRate();
      try{localStorage.setItem("timeRate",rateEl.value)}catch(e){}
      filterAndRender();
    },250));
  }
  filterAndRender();
}

function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
function isPhone(){return window.matchMedia("(max-width:700px)").matches}

// Cost/time combinations: computed in the browser because cost_plus_time and
// score_per_all depend on the reader's hourly rate (the "Time worth" field).
function rowCost(r){
  if(!COMBOS)return null;
  let sum=0,seen=false;
  for(const f of COMBOS.cost){
    const v=r[f];
    if(typeof v==="number"&&isFinite(v)){sum+=v;seen=true;}
  }
  return seen?sum/COMBOS.cost_scale:null;
}
function rowMinutes(r){
  if(!COMBOS)return null;
  const v=r[COMBOS.time];
  if(typeof v!=="number"||!isFinite(v))return null;
  return COMBOS.time_unit==="min"?v:v/60;
}
function comboVal(r,col){
  if(!COMBOS)return null;
  const c=rowCost(r),t=rowMinutes(r);
  if(col==="cost_per_min")return(c!=null&&t>0)?c/t:null;
  const blended=(c!=null&&t!=null)?c+t*timeRate/60:null;
  if(col==="cost_plus_time")return blended;
  if(col==="score_per_all"){
    const s=r[COMBOS.score];
    return(typeof s==="number"&&blended!=null&&blended>0)?s/blended:null;
  }
  return null;
}
function colVal(r,col){return COMBO_COLS.has(col)?comboVal(r,col):r[col];}
function sortBy(col,dir){sortCol=col;sortDir=HIGHLIGHTS[col]==="lower"?1:-1;page=0;filterAndRender();}

function buildGroupToggles(){
  const el=document.getElementById("group-toggles");
  GROUP_ORDER.forEach(g=>{
    const b=document.createElement("button");b.className="grp-btn active";
    b.textContent=GROUP_LABELS[g];b.dataset.group=g;
    b.addEventListener("click",()=>{
      if(hiddenGroups.has(g)){hiddenGroups.delete(g);b.classList.add("active")}
      else{hiddenGroups.add(g);b.classList.remove("active")}
      buildHeader();renderRows();
    });
    el.appendChild(b);
  });
}


function visibleCols(){
  const cols=COLUMNS.filter(c=>{
    const g=GROUP_ORDER.find(gk=>COL_GROUPS[gk]&&COL_GROUPS[gk].includes(c));
    return !g||!hiddenGroups.has(g);
  });
  // The frozen column has to come first, or pinned left:0 would cover a column
  // that scrolls under it.
  const at=STICKY_COL?cols.indexOf(STICKY_COL):-1;
  if(at>0){cols.splice(at,1);cols.unshift(STICKY_COL);}
  // On a phone the other identity columns (slug, creator, dates, flags) are
  // wide and crowd out the numbers next to the frozen name, so measurements
  // come first there and identity columns go last.
  if(isPhone()&&STICKY_COL){
    const rest=cols.filter(c=>c!==STICKY_COL);
    return [STICKY_COL]
      .concat(rest.filter(c=>colGroup(c)!=="identity"))
      .concat(rest.filter(c=>colGroup(c)==="identity"));
  }
  return cols;
}
function colGroup(col){return GROUP_ORDER.find(g=>COL_GROUPS[g]&&COL_GROUPS[g].includes(col))||"";}

function buildHeader(){
  const thead=document.getElementById("thead");thead.innerHTML="";
  const tr=document.createElement("tr");
  visibleCols().forEach(col=>{
    const th=document.createElement("th");
    th.textContent=LABELS[col]||col;th.dataset.col=col;
    const g=colGroup(col);if(g)th.classList.add("gp-"+g);
    if(TXT_COLS.has(col))th.classList.add("text-col");
    if(col===STICKY_COL)th.classList.add("sticky-col");
    if(sortCol===col)th.classList.add(sortDir===1?"asc":"desc");
    th.addEventListener("click",()=>{
      if(sortCol===col)sortDir*=-1;
      else{sortCol=col;sortDir=HIGHLIGHTS[col]==="lower"?1:-1}
      page=0;filterAndRender();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function filterAndRender(){
  const q=document.getElementById("search").value.toLowerCase();
  const hF=document.getElementById("__FILTER_ID__").value;
  filtered=TABLE_DATA.filter(r=>{
    if(q){
      const h=[...TXT_COLS].map(c=>r[c]).filter(Boolean).join(" ").toLowerCase();
      if(!h.includes(q))return false;
    }
    if(hF&&r[FILTER_FIELD]!==hF)return false;
    if(frontierMode==="complete"&&FRONTIER){
      if(!FRONTIER.complete.every(c=>typeof r[c]==="number"&&isFinite(r[c])&&r[c]>0))return false;
    }
    if(frontierMode.indexOf("pareto")===0&&FRONTIER){
      const f=(FRONTIER.filters||[]).find(x=>x.value===frontierMode);
      if(f&&!r[f.col])return false;
    }
    if(minScore!==null&&FRONTIER&&!(typeof r[FRONTIER.score]==="number"&&r[FRONTIER.score]>=minScore))return false;
    if(freeOnly&&!r.has_free_api)return false;
    return true;
  });
  if(sortCol){
    filtered.sort((a,b)=>{
      let va=colVal(a,sortCol),vb=colVal(b,sortCol);
      if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return-1;
      if(typeof va==="string")return va.localeCompare(vb)*sortDir;
      return(va-vb)*sortDir;
    });
  }
  buildHeader();renderRows();
}

function fmtNum(v,col){
  if(col==="total_tokens"||col==="input_tokens"||col==="output_tokens"){
    return v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e3?(v/1e3).toFixed(1)+"k":(""+v);
  }
  if(col.includes("cost")||(LABELS[col]||"").includes("$")||col==="cost_per_score"){
    return v<0.001?v.toFixed(6):v<0.1?v.toFixed(4):v.toFixed(2);
  }
  if(col.includes("rate"))return (v*100).toFixed(1)+"%";
  const a=Math.abs(v);
  if(a<1){
    // Tiny ratio/metric values: use adaptive significant figures so values
    // like score_per_1000_tokens (~1e-5) don't collapse to "0.0000".
    if(a<1e-4)return "~"+v.toFixed(7);
    let dec=4;while(a<Math.pow(10,-dec)&&dec<9)dec++;
    return v.toFixed(dec);
  }
  if(a<100)return v.toFixed(3);return v.toFixed(2);
}

function renderRows(){
  const cols=visibleCols(),tbody=document.getElementById("tbody");tbody.innerHTML="";
  const start=page*PS,slice=filtered.slice(start,start+PS);
  slice.forEach(r=>{
    const tr=document.createElement("tr");
    cols.forEach(col=>{
      const td=document.createElement("td");const v=r[col];
      const g=colGroup(col);if(g)td.classList.add("gp-"+g);
      if(TXT_COLS.has(col))td.classList.add("text-col");
      if(col===STICKY_COL)td.classList.add("sticky-col");
      if(COMBO_COLS.has(col)){
        const cv=comboVal(r,col);
        td.textContent=cv==null?"":fmtNum(cv,col);
      }
      else if(v==null||v==="")td.textContent="";
      else if(BOOL_COLS.has(col))td.textContent=v?"Yes":"";
      else if(typeof v==="number")td.textContent=fmtNum(v,col);
      else if(col===STICKY_COL&&/ \([^()]*\)$/.test(v)){
        // "Claude Sonnet 5.5 (xhigh)": the variant gets its own small line on
        // phones (see .mv), so the frozen column stays narrow there.
        const cut=v.lastIndexOf(" (");
        const name=document.createElement("span");name.className="mn";name.textContent=v.slice(0,cut);
        const variant=document.createElement("span");variant.className="mv";variant.textContent=v.slice(cut+2,-1);
        td.append(name," ",variant);
      }
      else td.textContent=v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const pEl=document.getElementById("paging"),total=filtered.length;
  const pages=Math.ceil(total/PS)||1;
  pEl.innerHTML='<span>'+total+' '+__ENTITY_LABEL__+'</span><span>Page '+(page+1)+'/'+pages+'</span><span>'+
    '<button onclick="page=Math.max(0,page-1);renderRows()">Prev</button> '+
    '<button onclick="page=Math.min('+(pages-1)+',page+1);renderRows()">Next</button></span>';
}
init();
</script>
</body>
</html>
